<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>67 AURA • GOD MODE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #05030a;
    font-family: 'Rajdhani', sans-serif;
    color: white;
    overflow-x: hidden;
    padding: 16px;
    position: relative;
  }

  /* Animated background */
  .bg-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow-1 {
    background: #8b00ff;
    top: -200px;
    left: -150px;
    animation: float1 12s ease-in-out infinite;
  }
  .bg-glow-2 {
    background: #ff00aa;
    bottom: -250px;
    right: -100px;
    animation: float2 15s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(80px, 60px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-70px, -50px); }
  }

  /* Scanlines */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.015) 3px
    );
    pointer-events: none;
    z-index: 1;
  }

  .calculator {
    position: relative;
    width: 100%;
    max-width: 380px;
    padding: 22px;
    border-radius: 32px;
    background: linear-gradient(160deg, rgba(40, 25, 70, 0.85), rgba(15, 8, 30, 0.95));
    border: 1px solid rgba(180, 80, 255, 0.4);
    box-shadow:
      0 0 40px rgba(140, 40, 255, 0.25),
      0 0 100px rgba(100, 0, 255, 0.15),
      inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    z-index: 2;
  }

  .header {
    text-align: center;
    margin-bottom: 18px;
  }

  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #e0aaff, #ff66ff, #c77dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(200, 100, 255, 0.6);
  }

  .header p {
    font-size: 11px;
    color: #b48cff;
    letter-spacing: 5px;
    margin-top: 6px;
    font-weight: 600;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 13px;
    font-weight: 600;
    color: #d4b3ff;
  }

  .stats b {
    color: #ff9eff;
  }

  #display-container {
    position: relative;
    margin-bottom: 16px;
  }

  #display {
    width: 100%;
    height: 92px;
    background: rgba(8, 4, 18, 0.9);
    border: 2px solid rgba(160, 70, 255, 0.5);
    border-radius: 18px;
    color: #f0e6ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 700;
    text-align: right;
    padding: 14px 16px;
    box-shadow:
      inset 0 0 25px rgba(120, 40, 255, 0.2),
      0 0 20px rgba(140, 50, 255, 0.15);
    letter-spacing: 1px;
  }

  #history {
    position: absolute;
    top: 8px;
    left: 14px;
    font-size: 12px;
    color: #9b7bcf;
    opacity: 0.8;
    max-width: 70%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    height: 64px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(145deg, #3a2d5c, #231a3a);
    color: white;
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 0 5px 0 #120c22;
    position: relative;
    overflow: hidden;
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #120c22;
  }

  button:hover {
    filter: brightness(1.15);
  }

  .operator {
    background: linear-gradient(145deg, #9b3dff, #5c15c4);
    box-shadow: 0 5px 0 #3a0a8a;
  }
  .operator:active { box-shadow: 0 2px 0 #3a0a8a; }

  .clear {
    background: linear-gradient(145deg, #ff2e5b, #b00030);
    box-shadow: 0 5px 0 #6e001c;
  }
  .clear:active { box-shadow: 0 2px 0 #6e001c; }

  .equal {
    background: linear-gradient(145deg, #e000ff, #8a00c4);
    box-shadow: 0 5px 0 #5a0080;
  }
  .equal:active { box-shadow: 0 2px 0 #5a0080; }

  .aura67 {
    background: linear-gradient(145deg, #ff00cc, #7a00ff);
    box-shadow: 0 5px 0 #4a0099;
    font-weight: 900;
  }
  .aura67:active { box-shadow: 0 2px 0 #4a0099; }

  .func {
    background: linear-gradient(145deg, #2e2545, #1a152b);
    font-size: 18px;
    color: #d4b8ff;
  }

  .wide {
    grid-column: span 2;
  }

  .memory {
    font-size: 16px;
    background: linear-gradient(145deg, #2a2240, #18122a);
    color: #c9a8ff;
  }

  .footer {
    margin-top: 18px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: #9b7bcf;
    font-weight: 600;
  }

  /* ===== AURA MODE ===== */
  #aura {
    position: fixed;
    inset: 0;
    display: none;
    z-index: 100;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: radial-gradient(circle at center, #9b00ff 0%, #2a0055 40%, #050008 100%);
    overflow: hidden;
  }

  #aura h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(140px, 32vw, 280px);
    font-weight: 900;
    color: white;
    text-shadow:
      0 0 20px #fff,
      0 0 60px #ff00ff,
      0 0 120px #a000ff;
    animation: power 0.4s infinite alternate;
    line-height: 0.9;
  }

  #aura h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 5.5vw, 38px);
    letter-spacing: 6px;
    margin-top: 10px;
    text-shadow: 0 0 25px white;
    animation: shake 0.1s infinite;
  }

  #aura p {
    color: #ffccff;
    letter-spacing: 5px;
    margin-top: 18px;
    font-size: 16px;
    font-weight: 700;
  }

  #aura button {
    margin-top: 40px;
    padding: 0 32px;
    height: 52px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 30px;
    font-size: 15px;
    letter-spacing: 2px;
    box-shadow: none;
  }

  @keyframes power {
    from { transform: scale(1) rotate(-1.5deg); }
    to   { transform: scale(1.12) rotate(1.5deg); }
  }

  @keyframes shake {
    0%   { transform: translate(2px, 1px); }
    50%  { transform: translate(-3px, -2px); }
    100% { transform: translate(1px, -2px); }
  }

  @keyframes fly {
    to {
      transform: translateY(-120vh) rotate(720deg) scale(0.3);
      opacity: 0;
    }
  }

  .particle {
    position: absolute;
    font-size: 32px;
    pointer-events: none;
    animation: fly 2.2s linear forwards;
    z-index: 101;
  }

  .shake-body {
    animation: screenShake 0.1s infinite;
  }

  @keyframes screenShake {
    0%, 100% { transform: translate(0); }
    25% { transform: translate(5px, -5px); }
    50% { transform: translate(-5px, 5px); }
    75% { transform: translate(5px, 5px); }
  }

  .level-up {
    animation: levelFlash 0.6s ease;
  }

  @keyframes levelFlash {
    0% { box-shadow: 0 0 0 0 rgba(255, 0, 255, 0.7); }
    50% { box-shadow: 0 0 60px 20px rgba(255, 0, 255, 0.4); }
    100% { box-shadow: 0 0 0 0 rgba(255, 0, 255, 0); }
  }

  @media (max-width: 400px) {
    .calculator { padding: 16px; }
    button { height: 58px; font-size: 20px; }
    #display { height: 82px; font-size: 28px; }
  }
</style>
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="calculator" id="calc">
    <div class="header">
      <h1>⚡ 67 AURA</h1>
      <p>ULTIMATE GOD MODE</p>
    </div>

    <div class="stats">
      <span>👑 AURA: <b id="score">0</b></span>
      <span>🔥 LEVEL: <b id="level">1</b></span>
    </div>

    <div id="display-container">
      <div id="history"></div>
      <input id="display" readonly placeholder="0">
    </div>

    <div class="buttons">
      <!-- Memory + Clear -->
      <button class="memory" onclick="memoryClear()">MC</button>
      <button class="memory" onclick="memoryRecall()">MR</button>
      <button class="memory" onclick="memoryAdd()">M+</button>
      <button class="memory" onclick="memorySub()">M−</button>

      <button class="clear" onclick="clearAll()">AC</button>
      <button class="func" onclick="toggleSign()">±</button>
      <button class="func" onclick="percent()">%</button>
      <button class="operator" onclick="append('/')">÷</button>

      <button class="func" onclick="square()">x²</button>
      <button class="func" onclick="sqrt()">√</button>
      <button class="func" onclick="append('(')">(</button>
      <button class="func" onclick="append(')')">)</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="operator" onclick="append('*')">×</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="operator" onclick="append('-')">−</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="operator" onclick="append('+')">+</button>

      <button class="wide" onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>

      <button class="aura67" onclick="append('67')">67</button>
      <button class="func" onclick="append('Math.PI')">π</button>
      <button class="func" onclick="backspace()">⌫</button>
    </div>

    <div class="footer">
      ⚡ NO LIMITS · MAXIMUM AURA ⚡
    </div>
  </div>

  <!-- AURA OVERLAY -->
  <div id="aura">
    <h1>67</h1>
    <h2>THE AURA IS UNMATCHED</h2>
    <p>☠️ MAXIMUM SIGMA OVERDRIVE ☠️</p>
    <h2>NO ONE CAN STOP HIM</h2>
    <button onclick="closeAura()">RETURN TO REALITY</button>
  </div>

<script>
  const display = document.getElementById("display");
  const historyEl = document.getElementById("history");
  const aura = document.getElementById("aura");
  const calc = document.getElementById("calc");

  let score = 0;
  let level = 1;
  let memory = 0;
  let cooldown = false;
  let lastExpression = "";

  function updateStats() {
    document.getElementById("score").textContent = score;
    const newLevel = Math.floor(score / 150) + 1;
    if (newLevel > level) {
      level = newLevel;
      calc.classList.add("level-up");
      setTimeout(() => calc.classList.remove("level-up"), 600);
      sound(1200);
    }
    document.getElementById("level").textContent = level;
  }

  function sound(freq = 480, type = "sine", duration = 0.12) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = type;
      gain.gain.setValueAtTime(0.07, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start();
      osc.stop(ctx.currentTime + duration);
      osc.onended = () => ctx.close();
    } catch {}
  }

  function append(value) {
    if (display.value === "ERROR" || display.value === "Infinity") display.value = "";
    display.value += value;
    sound(420 + Math.random() * 80);
    checkAura();
  }

  function clearAll() {
    display.value = "";
    historyEl.textContent = "";
    sound(280);
  }

  function backspace() {
    display.value = display.value.slice(0, -1);
    sound(360);
  }

  function toggleSign() {
    if (!display.value) return;
    if (display.value.startsWith("-")) {
      display.value = display.value.slice(1);
    } else {
      display.value = "-" + display.value;
    }
    sound(500);
  }

  function percent() {
    try {
      const val = parseFloat(display.value);
      if (!isNaN(val)) {
        display.value = (val / 100).toString();
        sound(550);
      }
    } catch {}
  }

  function square() {
    try {
      const val = parseFloat(display.value);
      if (!isNaN(val)) {
        display.value = (val * val).toString();
        score += 5;
        updateStats();
        sound(600);
        checkAura();
      }
    } catch {}
  }

  function sqrt() {
    try {
      const val = parseFloat(display.value);
      if (!isNaN(val) && val >= 0) {
        display.value = Math.sqrt(val).toString();
        score += 5;
        updateStats();
        sound(620);
        checkAura();
      }
    } catch {}
  }

  function memoryClear() {
    memory = 0;
    sound(300);
  }

  function memoryRecall() {
    display.value = memory.toString();
    sound(450);
  }

  function memoryAdd() {
    const val = parseFloat(display.value);
    if (!isNaN(val)) {
      memory += val;
      sound(580);
    }
  }

  function memorySub() {
    const val = parseFloat(display.value);
    if (!isNaN(val)) {
      memory -= val;
      sound(400);
    }
  }

  function calculate() {
    try {
      let expr = display.value;
      if (!expr) return;

      // Basic safety
      if (!/^[0-9+\-*/.()%\sMath\.PI]+$/.test(expr.replace(/Math\.PI/g, "1"))) {
        throw new Error();
      }

      lastExpression = expr;
      const result = Function('"use strict"; return (' + expr + ')')();

      if (!Number.isFinite(result)) throw new Error();

      historyEl.textContent = lastExpression + " =";
      display.value = Number(result.toPrecision(12)).toString();

      score += 12;
      updateStats();
      sound(780, "triangle", 0.18);

      if (display.value === "67" || display.value.includes("67")) {
        score += 670;
        updateStats();
        activateAura();
      } else {
        checkAura();
      }
    } catch {
      display.value = "ERROR";
      sound(140, "sawtooth", 0.2);
    }
  }

  function checkAura() {
    if (display.value.includes("67") && !cooldown) {
      activateAura();
    }
  }

  function activateAura() {
    if (cooldown) return;
    cooldown = true;

    aura.style.display = "flex";
    document.body.classList.add("shake-body");

    score += 67;
    updateStats();
    sound(1100, "square", 0.25);

    const emojis = ["⚡", "🔥", "💀", "67", "🗿", "👑", "✨", "💥", "🌌", "☠️"];
    for (let i = 0; i < 90; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = Math.random() * 100 + "vw";
      p.style.top = (30 + Math.random() * 50) + "vh";
      p.style.fontSize = (24 + Math.random() * 28) + "px";
      p.style.animationDuration = (1.3 + Math.random() * 1.8) + "s";
      aura.appendChild(p);
      setTimeout(() => p.remove(), 3200);
    }

    setTimeout(() => {
      closeAura();
      cooldown = false;
    }, 4200);
  }

  function closeAura() {
    aura.style.display = "none";
    document.body.classList.remove("shake-body");
  }

  // Keyboard support
  document.addEventListener("keydown", (e) => {
    if (e.key >= "0" && e.key <= "9") append(e.key);
    else if (e.key === ".") append(".");
    else if (e.key === "+") append("+");
    else if (e.key === "-") append("-");
    else if (e.key === "*") append("*");
    else if (e.key === "/") append("/");
    else if (e.key === "Enter" || e.key === "=") calculate();
    else if (e.key === "Backspace") backspace();
    else if (e.key === "Escape") clearAll();
    else if (e.key === "(") append("(");
    else if (e.key === ")") append(")");
  });
</script>
</body>
</html>
